<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-label="stt-tts: speech to text on top, text to speech beneath, mirrored">
  <title>stt-tts: speech-to-text and text-to-speech, mirrored</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b4250"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2430; }
      .side { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; fill: #5b6372; }
      .band { font-size: 13px; font-weight: 600; }
      .name { font-size: 15px; font-weight: 600; text-anchor: middle; }
      .sub { font-size: 12px; text-anchor: middle; fill: #4a5160; }
      .foot { font-size: 12px; fill: #5b6372; }
      .box { fill: #ffffff; stroke: #8a92a3; stroke-width: 1.25; }
      .edge { stroke: #3b4250; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Card background so the diagram reads on light and dark GitHub themes -->
  <rect x="0.5" y="0.5" width="959" height="355" rx="12" fill="#f7f8fa" stroke="#d5d9e0"/>

  <text class="side" x="36" y="38">USER SIDE · AUDIO</text>
  <text class="side" x="924" y="38" text-anchor="end">MODEL SIDE · TEXT</text>

  <!-- Speech to text band (top) -->
  <rect x="20" y="52" width="920" height="124" rx="10" fill="#e8f0fb" stroke="#b9cdeb"/>
  <text class="band" x="36" y="74" fill="#1f4f99">Speech → Text  (listen)</text>

  <!-- Text to speech band (bottom), abutting the top band -->
  <rect x="20" y="176" width="920" height="124" rx="10" fill="#fbf1e4" stroke="#ecd2ab"/>
  <text class="band" x="924" y="198" text-anchor="end" fill="#8a4b08">(reply)  Text → Speech</text>

  <!-- Top row: left to right -->
  <rect class="box" x="36" y="88" width="192" height="64" rx="8"/>
  <text class="name" x="132" y="115">Audio in</text>
  <text class="sub" x="132" y="137">mic · Bluetooth · Zenoh</text>

  <rect class="box" x="268" y="88" width="192" height="64" rx="8"/>
  <text class="name" x="364" y="115">Input adapter</text>
  <text class="sub" x="364" y="137">16 kHz mono PCM</text>

  <rect class="box" x="500" y="88" width="192" height="64" rx="8"/>
  <text class="name" x="596" y="115">STT engine</text>
  <text class="sub" x="596" y="137">Moonshine (stub)</text>

  <rect class="box" x="732" y="88" width="192" height="64" rx="8"/>
  <text class="name" x="828" y="115">Text out</text>
  <text class="sub" x="828" y="137">LLM · stdout · Zenoh</text>

  <path class="edge" d="M228 120H266" marker-end="url(#arrow)"/>
  <path class="edge" d="M460 120H498" marker-end="url(#arrow)"/>
  <path class="edge" d="M692 120H730" marker-end="url(#arrow)"/>

  <!-- Bottom row: right to left -->
  <rect class="box" x="36" y="212" width="192" height="64" rx="8"/>
  <text class="name" x="132" y="239">Audio out</text>
  <text class="sub" x="132" y="261">speaker · Bluetooth · Zenoh</text>

  <rect class="box" x="268" y="212" width="192" height="64" rx="8"/>
  <text class="name" x="364" y="239">Output adapter</text>
  <text class="sub" x="364" y="261">small buffer, interruptible</text>

  <rect class="box" x="500" y="212" width="192" height="64" rx="8"/>
  <text class="name" x="596" y="239">TTS engine</text>
  <text class="sub" x="596" y="261">Kokoro (stub)</text>

  <rect class="box" x="732" y="212" width="192" height="64" rx="8"/>
  <text class="name" x="828" y="239">Text in</text>
  <text class="sub" x="828" y="261">LLM reply · stdin · Zenoh</text>

  <path class="edge" d="M732 244H694" marker-end="url(#arrow)"/>
  <path class="edge" d="M500 244H462" marker-end="url(#arrow)"/>
  <path class="edge" d="M268 244H230" marker-end="url(#arrow)"/>

  <text class="foot" x="36" y="330">One button: press to listen · send · cancel · interrupt.  The mic is closed while the module speaks.</text>
</svg>
